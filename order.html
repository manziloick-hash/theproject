<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bistro Delight • Order</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

 <header>
  <nav class="container">
   <a href="index.html"><div class="logo">Bistro Delight</div></a>    
   <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="order.html" style="color: #e67e22">Order</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="Invoice.html">Invoice</a></li>
      <li><a href="signup.html">Signup</a></li>
    </ul>
  </nav>
</header>

<section>
  <div class="container">
    <h2>Place Your Order</h2>
    
    <form id="orderForm">
      <label>Full Name</label>
      <input type="text" id="fullName" placeholder="Your name" required>

      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="0788 xxx xxx" required>

      <label>Delivery Address</label>
      <input type="text" id="address" placeholder="Street, House/Apartment number" required>

      <label>Order Type</label>
      <select id="orderType" required>
        <option value="">Choose...</option>
        <option>Delivery</option>
        <option>Pickup</option>
      </select>

      <label>Your Order</label>
      <textarea id="orderDetails" rows="6" placeholder="Example: 2× Classic Burger, 1× Pepsi, no onions..." required></textarea>

      <button type="submit" class="btn" style="width:100%; padding:16px; font-size:1.3rem; margin-top:1.5rem;">
        Send Order → Pay on Delivery
      </button>
    </form>  

    <p style="text-align:center; margin-top:2rem;">
      Prefer WhatsApp? → 
      <a href="https://wa.me/250788123456?text=I%20want%20to%20order..." target="_blank" style="color:#25D366; font-weight:bold;">
        Click here to order on WhatsApp
      </a>
    </p>
  </div>
</section>

<footer></footer>

<script>
  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault(); 

    
    const name    = document.getElementById("fullName").value.trim();
    const phone   = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const type    = document.getElementById("orderType").value;
    const details = document.getElementById("orderDetails").value.trim();

    
    if (!name || !phone || !address || !type || !details) {
      alert("Please fill in all fields!");
      return;
    }

    
    const params = new URLSearchParams({
      name:    name,
      phone:   phone,
      address: address,
      type:    type,
      order:   details
    });

    window.location.href = "invoice.html?" + params.toString();
  });
</script>

</body>
</html>
